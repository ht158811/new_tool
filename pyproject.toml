[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-manager-local"
version = "0.1.0"
description = "Local offline visual dataset manager"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
  "PySide6-Essentials>=6.7,<7",
  "Pillow>=10.3,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[project.scripts]
dataset-manager = "dataset_manager.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

